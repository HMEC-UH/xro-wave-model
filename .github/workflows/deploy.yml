
name: Deploy MkDocs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mkdocs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs==1.6.1 mkdocs-material pyyaml

      - name: Generate navigation
        run: python docs/generate_nav.py

      - name: Validate website
        run: |
          cd docs
          mkdocs build --strict --config-file mkdocs.generated.yml

      - name: Deploy to gh-pages
        run: |
          cd docs
          mkdocs gh-deploy \
            --config-file mkdocs.generated.yml \
            --force --clean
